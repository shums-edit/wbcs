<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - UPSC Rule Keeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="container">
        <div class="login-wrapper">
            <div class="glass-card">
                <h1 style="text-align:center; margin-bottom:15px;">🔐 RESET PASSWORD</h1>
                <p style="text-align:center; color:#f0f0f5; margin-bottom:20px;">
                    Enter your email to receive a password reset link.
                </p>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="reset-email" placeholder="your@email.com" autocomplete="off">
                </div>
                <button id="send-reset-btn" class="btn-primary">SEND RESET LINK</button>
                <div class="forgot-password" style="margin-top:15px;">
                    <a href="index.html">← Back to Login</a>
                </div>
                <div id="reset-message" class="message"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // FIX: import from firebase-config — no more broken placeholder config
        import { auth } from "./firebase-config.js";
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        document.getElementById("send-reset-btn").addEventListener("click", async () => {
            const email = document.getElementById("reset-email").value.trim();
            const messageDiv = document.getElementById("reset-message");

            if (!email) {
                messageDiv.innerHTML = "❌ Please enter your email.";
                messageDiv.style.color = "red";
                return;
            }

            // Disable button while processing
            const btn = document.getElementById("send-reset-btn");
            btn.disabled = true;
            btn.textContent = "Sending...";

            try {
                await sendPasswordResetEmail(auth, email);
                messageDiv.innerHTML = "✅ Reset link sent! Check your inbox (and spam folder).";
                messageDiv.style.color = "green";
            } catch (error) {
                // Generic message to avoid revealing whether email is registered
                messageDiv.innerHTML = "📧 If this email is registered, you will receive a reset link shortly.";
                messageDiv.style.color = "orange";
            } finally {
                btn.disabled = false;
                btn.textContent = "SEND RESET LINK";
            }
        });
    </script>
</body>
</html>
